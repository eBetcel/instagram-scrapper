services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agenda
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda"]
      interval: 5s
      retries: 10

  # S3 local (SeaweedFS). Credenciais em seaweedfs/s3.json (iguais ao .env.example).
  # O bucket é criado pelo S3Storage no primeiro uso.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfsdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # SMTP de desenvolvimento: os e-mails de login aparecem em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  seaweedfsdata:

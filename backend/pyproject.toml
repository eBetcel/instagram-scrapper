[project]
name = "agenda"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]>=3",
  "pydantic>=2",
  "pydantic-settings",
  "openai",
  "instaloader",
  "boto3",
  "pillow",
  "typer",
  "cryptography",
]

[dependency-groups]
dev = ["pytest", "testcontainers[postgres]"]

[project.scripts]
agenda = "agenda.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenda"]

[tool.pytest.ini_options]
testpaths = ["tests"]

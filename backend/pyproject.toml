[project]
name = "agenda"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]>=3",
  "pydantic>=2",
  "pydantic-settings",
  "openai",
  "instaloader",
  "boto3",
  "pillow",
  "typer",
  "cryptography",
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "testcontainers[postgres]",
]

[project.scripts]
agenda = "agenda.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
